name: Automated YouTube Competitor & Script Pipeline

on:
  schedule:
  # Yeh cron job har Monday subah 6 AM UTC par automatically run karegi
    - cron: '0 6 * * 1'
  workflow_dispatch: // Manual trigger button ke liye bhi option rahega

jobs:
  run-pipeline:
  runs-on: ubuntu-latest
  steps:
    - name: Checkout Repository
    uses: actions/checkout@v4

    - name: Set up Python
    uses: actions/setup-python@v5
    with:
      python-version: '3.10'

    - name: Install Dependencies
    run: |
      python -m pip install --upgrade pip
      pip install youtube-transcript-api anthropic requests

    - name: Run Analysis and Script Generation
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
    run: |
      python main.py
